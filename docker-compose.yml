services:
  mongodb:
    image: mongo:7.0
    container_name: hedefbasari_db
    restart: always
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: hedefbasari_redis
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: hedefbasari_backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/hedefbasari
      - TZ=Europe/Istanbul
    depends_on:
      - mongodb
      - redis

  frontend:
    build: ./frontend
    container_name: hedefbasari_frontend
    restart: always
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: hedefbasari_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongo_data:
  redis_data:
